[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodeseek-bot"
version = "0.1.0"
description = "Telegram bot that watches NodeSeek new topics and pushes keyword matches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PaopaoSugar" }]
keywords = ["nodeseek", "telegram", "rss", "bot"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiogram>=3.4,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
nodeseek-bot = "nodeseek_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nodeseek_bot"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    # 本地开发产物（不进仓库）
    ".deps",
    ".venv",
    # 文档里有示意用的 Python 片段，不参与格式化
    "docs",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
